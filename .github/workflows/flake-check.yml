---
name: flake-check

on:
  push:
    branches: [main] # only guard main
  pull_request:
  workflow_call: # reusable from flake-update.yml

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # main
        with:
          fail-mode: true
      - run: nix flake check --accept-flake-config
        # covers: treefmt checks (nixpkgs-fmt, deadnix, statix, typos, prettier …).
        # commitizen + detect-private-keys run locally via prek, not in CI.

  # Instantiate a fresh Consumer with source-only imports from the checkout
  # and build its toplevel closure — the contract library checks alone miss.
  consumer-fixture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Nix needs revCount for the git+file input below.
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3
      - run: nix flake new /tmp/fixture -t .#default --accept-flake-config
      # Build instead of eval: eval only proves the derivation constructs.
      # Without this gate, build breaks surface at the desktop switch, not
      # in CI — the DMS family (dms, dank-greeter, dms-plugins) has no binary
      # cache and compiles from source, so this is what catches them pre-merge.
      # Use the PR's standalone dependency pins; only the template needs hardware.
      - run: >
          nix build
          /tmp/fixture#nixosConfigurations.myHost.config.system.build.toplevel
          --reference-lock-file "$GITHUB_WORKSPACE/flake.lock"
          --no-write-lock-file --override-input dotnix "git+file://$GITHUB_WORKSPACE"
          --override-input nixos-hardware "github:NixOS/nixos-hardware/$(jq -er '.nodes[.nodes[.root].inputs["nixos-hardware"]].locked.rev' /tmp/fixture/flake.lock)"
          --accept-flake-config
